version: '3.9'

services:
    postgres:
        image: postgres:16-alpine
        container_name: doctask-postgres 

        restart: unless-stopped
        environment:
            POSTGRES_DB: doctask 
            POSTGRES_USER: user 
            POSTGRES_PASSWORD: 1234
        ports: 
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user"]
            interval: 10s
            timeout: 5s
            retries: 5 

    # backend:

    # frontend:

volumes:
    postgres_data:
    