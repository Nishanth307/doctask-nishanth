services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: doctask-postgres 

        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-doctask}
            POSTGRES_USER: ${POSTGRES_USER:-user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
        ports: 
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-doctask}"]
            interval: 10s
            timeout: 5s
            retries: 5 

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: doctask-backend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            PORT: ${PORT:-8000}
            DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-doctask}
            CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
        ports:
            - "${PORT:-8000}:8000"
        volumes:
            - ./storage:/app/storage
            - ./backend/app:/app/app
        depends_on:
            postgres:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: doctask-frontend
        restart: unless-stopped
        environment:
            VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        ports:
            - "${FRONTEND_PORT:-5173}:5173"
        volumes:
            - ./frontend/src:/app/src
            - ./frontend/public:/app/public
        depends_on:
            - backend

volumes:
    postgres_data: