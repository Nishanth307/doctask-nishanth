services:
  # ── FastAPI Backend Web Service ──────────────────────────────────────────────
  - type: web
    name: doctask-backend
    runtime: docker
    # Build from repo root so requirements.txt is accessible
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Injected automatically by Render from the linked PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: doctask-db
          property: connectionString
      # ── Secrets: set these manually in the Render dashboard ──────────────────
      - key: GOOGLE_API_KEY
        sync: false  # You will paste this in the Render dashboard
      # CORS: set to your Vercel frontend URL once deployed
      # e.g. https://doctask-frontend.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # LLM settings
      - key: LLM_PRIMARY_MODEL
        value: gemini-2.5-pro
      - key: LLM_FALLBACK_MODELS
        value: "gemini-2.5-pro,gemini-2.5-flash,gemini-2.0-flash"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ── Render Managed PostgreSQL (with pgvector) ────────────────────────────────
databases:
  - name: doctask-db
    plan: free
    region: oregon
    databaseName: doctask
    user: doctask_user
    postgresMajorVersion: 16
